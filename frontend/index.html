<!doctype html>
<!-- data-kit="pro": the app-wide UI kit (dense, non-boxy). Its values live under [data-kit="pro"] in src/index.css. -->
<html lang="en" data-kit="pro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Apply the saved theme before the first paint, so dark mode never flashes light (ThemeContext takes over after). -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("anarix-theme") || "light";
          if (t === "system") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.classList.add(t);
          document.documentElement.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
    <!-- The page canvas colour before the CSS bundle arrives, so a slow load is never a white flash in dark mode. -->
    <style>
      html { background: #f7f7fa; }
      html.dark { background: #121217; }
    </style>
    <!-- TODO: Set the document title to the name of your application -->
    <title>Lovable App</title>
    <meta name="description" content="Lovable Generated Project" />
    <meta name="author" content="Lovable" />
    <link id="app-favicon" rel="icon" href="/favicon-new.svg" type="image/svg+xml" />

    <!-- TODO: Update og:title to match your application name -->
    <meta property="og:title" content="Lovable App" />
    <meta property="og:description" content="Lovable Generated Project" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Lovable" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
